# This is a basic workflow to help you get started with Actions
name: Variables Ambiente ENV

on:
  push:
    

  #  Permite ejecutar el workflow de forma manuela
  workflow_dispatch:

env:
  SALUDO: "Hola desde el workflow"

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "demo-env"
  demo-env:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    env: 
      SALUDO: "Hola dede el JOB"
      
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      - name: "Mostrar variable a nivel job"
        run: echo "SALUDO = $SALUDO" 

      # Runs a single command using the runners shell
      - name: Mostrar varables a nivel del step
        env:
         SALUDO: "Hola desde el STEP"
        run: echo "SALUDO = $SALUDO"
        
  demo2-env:
    runs-on: ubuntu-latest

    steps:
     - name: "Mostrar variable del workflow"
       run: echo "SALUDO=$SALUDO"
